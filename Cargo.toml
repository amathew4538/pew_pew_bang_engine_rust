[package]
name = "pew_pew_bang_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.34"
pollster = "1.0.1"
reqwest = "0.13.5"
rodio = "0.22.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tobj = { version = "4.0.5", default-features = false, features = ["tokio"] }
tokio = "1.53.3"
wgpu = { version = "30.0.1", features = ["webgl"]}
winit = "0.30.13"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}

[lib]
crate-type = ["cdylib", "rlib"]
